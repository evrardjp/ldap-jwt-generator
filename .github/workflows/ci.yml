name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      docker:
        image: docker:latest
        options: --privileged

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker
        run: docker info

      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          install: true
          experimental: true

      - name: Run all tests
        run: mise run test:all

      - name: Show log
        if: always()
        run: mise run dev:logs

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage.out
            coverage.html
          if-no-files-found: ignore
          retention-days: 30

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          install: true
          experimental: true

      - name: Run linters
        run: mise run test:lint

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          install: true
          experimental: true

      - name: Build binary and container
        run: mise run build

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ldap-jwt-generator-binary
          path: bin/ldap-jwt-generator
          retention-days: 7
